[package]
name = "cubbydb"
version = "0.1.14"
description = "A modern, restrained desktop Postgres client."
authors = ["CubbyDB contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# The library target holds all app logic so it can be unit-tested independently
# of the Tauri binary entry point.
[lib]
name = "cubbydb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app update check + install, and the ability to relaunch after installing
# one. Linux only self-updates from the AppImage bundle target (not .deb) —
# a Tauri/OS constraint, not something configurable here.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Native save dialog, so an export can choose its own folder and filename —
# a webview download can only ever drop into the browser download directory.
tauri-plugin-dialog = "2"

# Async runtime for the database driver.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }

# Postgres driver. `tokio-postgres` is the well-maintained async client. We read
# result sets with `simple_query`, which returns every value in its canonical
# text form, so the results grid needs no per-type conversion logic.
tokio-postgres = { version = "0.7", features = ["runtime"] }

# TLS so we can reach cloud/managed Postgres (RDS, Supabase, etc.). native-tls
# uses the OS trust store, so there are no extra system dependencies. The driver
# uses sslmode=prefer semantics: TLS when the server offers it, plaintext when
# it does not.
native-tls = "0.2"
postgres-native-tls = "0.5"

# Trait objects with async methods (the database-driver abstraction).
async-trait = "0.1"

# HTTP client for the AI assistant's calls to the Anthropic and OpenAI APIs.
# native-tls (not rustls) to match the TLS story already used for Postgres.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# The AI assistant's system prompt states today's date. Without it the model
# answers "how many rows from yesterday" against its training cutoff instead
# of the user's clock, which is silently wrong rather than an error. Needs
# the local timezone (not UTC) since "yesterday" means the user's yesterday.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# System clipboard access for the grid's copy/paste — the webview's own
# `navigator.clipboard` isn't reliably available inside the Tauri window.
arboard = "3"

thiserror = "2"

[features]
# This feature is used by Tauri's mobile tooling; kept for forward-compat.
custom-protocol = ["tauri/custom-protocol"]

# OS credential storage for saved-connection passwords (macOS Keychain,
# Windows Credential Manager, Linux Secret Service) instead of plaintext
# JSON. `keyring` has no default backend — each platform needs its own
# feature flag, per the crate's own cross-compilation recipe (its docs.rs
# metadata pairs the Linux backend with `crypto-rust` explicitly, so that's
# included here too). Only the macOS (`apple-native`) path is build- and
# runtime-verified in this repo's dev environment; Windows/Linux are wired
# per the crate's documented combination but unverified here.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
